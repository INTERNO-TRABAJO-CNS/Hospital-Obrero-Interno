 font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="113" y="1151">Backend filtra los datos por paciente / rol. WebSocket comunica el evento y permite refrescar; NO confirma una reserva.</text></svg>