ns, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="1564" y="1011.2">Auditoría de operaciones</text><polyline fill="none" points="1279,797 1279,822 1776,822 1776,873" stroke="#71849A" stroke-linejoin="round" stroke-width="2.2" /><line stroke="#71849A" stroke-linecap="round" stroke-width="2.2" x1="1776" x2="1776" y1="822" y2="873" /><polygon fill="#71849A" points="1769.7674679981453,861.5914266954252 1782.2325320018547,861.5914266954252 1776,873" /><rect fill="#E7F7F3" height="202" rx="15" ry="15" stroke="#127E79" stroke-width="2" width="468" x="2032" y="882" /><text fill="#127E79" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="2053" y="919">MDL-05 · Consultas y avisos</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="2054" y="954.0">Responsable(s): Abigail + otros CU</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="2054" y="982.6">Consultas / notificaciones</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="2054" y="1011.2">Reportes y eventos</text><polyline fill="none" points="1279,797 1279,822 2266,822 2266,873" stroke="#71849A" stroke-linejoin="round" stroke-width="2.2" /><line stroke="#71849A" stroke-linecap="round" stroke-width="2.2" x1="2266" x2="2266" y1="822" y2="873" /><polygon fill="#71849A" points="2259.7674679981455,861.5914266954252 2272.2325320018545,861.5914266954252 2266,873" /><rect fill="#EDF2F6" height="175" rx="23" ry="23" stroke="#71849A" stroke-width="2" width="1660" x="88" y="1184" /><text fill="#14395D" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-style="normal" font-weight="bold" opacity="1" text-anchor="middle" x="919" y="1238">PostgreSQL · base de datos del sistema</text><text fill="#5B7287" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="normal" opacity="1" text-anchor="middle" x="919" y="1280">Los módulos guardan y consultan datos; MDL-03 confirma la cita en una única transacción.</text><rect fill="#FFF5E1" height="175" rx="23" ry="23" stroke="#A36811" stroke-width="2" width="641" x="1830" y="1184" /><text fill="#A36811" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-style="normal" font-weight="bold" opacity="1" text-anchor="middle" x="2150" y="1238">WebSocket · solo avisos</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="1870" y="1281.0">Notifica eventos confirmados; NO reserva cupos.</text><polyline fill="none" points="306,1100 306,1140 910,1140 910,1174" stroke="#71849A" stroke-linejoin="round" stroke-width="3" /><line stroke="#71849A" stroke-linecap="round" stroke-width="3" x1="910" x2="910" y1="1140" y2="1174" /><polygon fill="#71849A" points="903.7674679981453,1162.591426695425 916.2325320018547,1162.591426695425 910,1174" /><polyline fill="none" points="1286,1100 1286,1140 910,1140" stroke="#71849A" stroke-linejoin="round" stroke-width="3" /><line stroke="#71849A" stroke-linecap="round" stroke-width="3" x1="1286" x2="910" y1="1140" y2="1140" /><polygon fill="#71849A" points="921.4085733045748,1133.7674679981453 921.4085733045748,1146.2325320018547 910,1140" /><polyline fill="none" points="2246,1100 2246,1170" stroke="#A36811" stroke-linejoin="round" stroke-width="3" /><line stroke="#A36811" stroke-linecap="round" stroke-width="3" x1="2246" x2="2246" y1="1100" y2="1170" /><polygon fill="#A36811" points="2239.7674679981455,1158.591426695425 2252.2325320018545,1158.591426695425 2246,1170" /><polyline fill="none" points="2030,1182 2030,1112" stroke="#A36811" stroke-dasharray="9,8" stroke-linejoin="round" stroke-width="2.5" /><line stroke="#A36811" stroke-linecap="round" stroke-width="2.5" x1="2030" x2="2030" y1="1182" y2="1112" /><polygon fill="#A36811" points="2036.2325320018547,1123.408573304575 2023.7674679981453,1123.408573304575 2030,1112" /><rect fill="#FFFFFF" height="306" rx="18" ry="18" stroke="#CEDCE8" stroke-width="2" width="2394" x="80" y="1442" /><rect fill="#E9F3FD" height="55" rx="15" ry="15" stroke="none" stroke-width="2" width="2392" x="81" y="1443" /><text fill="#2763A1" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="99" y="1480">DEPENDENCIAS CLAVE ENTRE MÓDULOS (SEGÚN EL PUML)</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="120" y="1538">MDL-03 → MDL-01: validar paciente     |     MDL-03 → MDL-02: comprobar disponibilidad</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="120" y="1583">MDL-04 → MDL-03: modificar cita         |     MDL-04 → MDL-02: revalidar recursos</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="120" y="1628">MDL-05 → MDL-01: autorizar consultas    |     MDL-05 → MDL-03 y MDL-04: leer eventos / cambios</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="120" y="1673">MDL-05 → WebSocket: emitir evento confirmado     |     WebSocket → Flutter: aviso para refrescar pantalla</text></svg>