le="normal" font-weight="normal" opacity="1" text-anchor="start" x="94" y="982.6">Persona / Afiliado / Paciente</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="94" y="1011.2">Autenticación y permisos</text><polyline fill="none" points="1279,797 1279,822 306,822 306,873" stroke="#71849A" stroke-linejoin="round" stroke-width="2.2" /><line stroke="#71849A" stroke-linecap="round" stroke-width="2.2" x1="306" x2="306" y1="822" y2="873" /><polygon fill="#71849A" points="299.7674679981454,861.5914266954252 312.2325320018546,861.5914266954252 306,873" /><rect fill="#F2EDFC" height="202" rx="15" ry="15" stroke="#7659A8" stroke-width="2" width="468" x="562" y="882" /><text fill="#7659A8" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="583" y="919">MDL-02 · Recursos</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="584" y="954.0">Responsable(s): Benjamín</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="584" y="982.6">Especialidad / Médico / Agenda</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="584" y="1011.2">Disponibilidad; no asigna citas</text><polyline fill="none" points="1279,797 1279,822 796,822 796,873" stroke="#71849A" stroke-linejoin="round" stroke-width="2.2" /><line stroke="#71849A" stroke-linecap="round" stroke-width="2.2" x1="796" x2="796" y1="822" y2="873" /><polygon fill="#71849A" points="789.7674679981453,861.5914266954252 802.2325320018547,861.5914266954252 796,873" /><rect fill="#E9F3FD" height="202" rx="15" ry="15" stroke="#2