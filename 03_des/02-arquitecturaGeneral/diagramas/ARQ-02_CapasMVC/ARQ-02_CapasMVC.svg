><rect fill="#E9F3FD" height="46" rx="15" ry="15" stroke="none" stroke-width="1" width="967" x="700" y="630" /><text fill="#14395D" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="715" y="663">IDA: acción del usuario → operación de negocio → base de datos</text><rect fill="#FFFFFF" height="462" rx="18" ry="18" stroke="#CEDCE8" stroke-width="2" width="2324" x="74" y="716" /><rect fill="#FFF5E1" height="55" rx="15" ry="15" stroke="none" stroke-width="2" width="2322" x="75" y="717" /><text fill="#A36811" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="93" y="754">CANAL DE NOTIFICACIÓN · DESPUÉS DEL COMMIT</text><rect fill="#F2EDFC" height="155" rx="15" ry="15" stroke="#7659A8" stroke-width="2" width="530" x="156" y="815" /><text fill="#7659A8" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="177" y="852">Servicio Java</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="178" y="887.0">La operación ya se guardó correctamente.</text><rect fill="#FFF5E1" height="155" rx="15" ry="15" stroke="#A36811" stroke-width="2" width="495" x="930" y="815" /><text fill="#A36811" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="951" y="852">WebSocket</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="952" y="887.0">Emite un evento sin realizar reservas.</text><rect fill="#E7F7F3" height="155" rx="15" ry="15" stroke="#127E79" stroke-width="2" width="580" x="1665" y="815" /><text fill="#127E79" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="1686" y="852">Interfaz Flutter</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="1687" y="887.0">Recibe el aviso y refresca la pantalla.</text><line stroke="#A36811" stroke-linecap="round" stroke-width="4" x1="694" x2="913" y1="887" y2="887" /><polygon fill="#A36811" points="901.5914266954252,893.2325320018547 901.5914266954252,880.7674679981453 913,887" /><line stroke="#A36811" stroke-linecap="round" stroke-width="4" x1="1439" x2="1649" y1="887" y2="887" /><polygon fill="#A36811" points="1637.591426695425,893.2325320018547 1637.591426695425,880.7674679981453 1649,887" /><rect fill="#FCEEEE" height="39" rx="15" ry="15" stroke="none" stroke-width="1" width="168" x="117" y="1072" /><text fill="#A74242" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="132" y="1098">IMPORTANTE</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="321" y="1097">La confirmación de una cita llega por REST; un mensaje WebSocket no la confirma.</text><rect fill="#FFFFFF" height="126" rx="18" ry="18" stroke="#CEDCE8" stroke-width="2" width="2324" x="74" y="1220" /><rect fill="#E7F7F3" height="55" rx="15" ry="15" stroke="none" stroke-width="2" width="2322" x="75" y="1221" /><text fill="#127E79" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="93" y="1258">EJEMPLO PARA EL EQUIPO</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="105" y="1300">Flutter solicita una cita → REST autoriza → Servicio valida cupos 