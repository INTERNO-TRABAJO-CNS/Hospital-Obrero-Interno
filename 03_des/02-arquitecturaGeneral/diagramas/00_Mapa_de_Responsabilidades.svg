ht="85" rx="21" ry="21" stroke="none" stroke-width="2" width="708" x="451" y="641" /><text fill="#A36811" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="474" y="697">Alex</text><text fill="#14395D" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="474" y="775">Cancelación, auditoría e historial</text><rect fill="#EDF2F6" height="38" rx="15" ry="15" stroke="none" stroke-width="1" width="235" x="475" y="799" /><text fill="#14395D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="489" y="824">CU-11, CU-14, CU-18</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="474" y="874">CambioCita · HistorialClinico; cancelaciones, consulta de</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="474" y="907">datos e historial de cambios.</text><rect fill="white" height="375" rx="22" ry="22" stroke="#CEDCE8" stroke-width="2" width="710" x="1194" y="640" /><rect fill="#E7F7F3" height="85" rx="21" ry="21" stroke="none" stroke-width="2" width="708" x="1195" y="641" /><text fill="#127E79" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="1218" y="697">Abigail</text><text fill="#14395D" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="1218" y="775">Atención y avisos</text><rect fill="#EDF2F6" height="38" rx="15" ry="15" stroke="none" stroke-width="1" width="235" x="1219" y="799" /><text fill="#14395D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="1233" y="824">CU-15, CU-16, CU-17</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="1218" y="874">Receta · Notificacion · Recordatorio; atención médica y</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="1218" y="907">comunicación al paciente.</text><rect fill="#FFFFFF" height="258" rx="18" ry="18" stroke="#CEDCE8" stroke-width="2" width="2215" x="92" y="1075" /><rect fill="#E9F3FD" height="55" rx="15" ry="15" stroke="none" stroke-width="2" width="2213" x="93" y="1076" /><text fill="#2763A1" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="111" y="1113">PUNTOS DE COORDINACIÓN ENTRE MÓDULOS</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="120" y="1172">Benjamín centraliza CitaMedica y la transacción de asignación (MDL-03). Matías valida identidad (MDL-01). Alejandro, Alex y Abigail consumen/actualizan citas mediante</text><text fill="#23394F" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="normal" opacity="1" text-anchor="start" x="120" y="1212">contratos de servicio, no duplicando el modelo. La disponibilidad se consulta a MDL-02; WebSocket solo comunica cambios ya confirmados.</text><rect fill="#FFF5E1" height="40" rx="15" ry="15" stroke="none" stroke-width="1" width="1047" x="113" y="1362" /><text fill="#A36811" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="bold" opacity="1" text-anchor="start" x="128" y="1389">IMPORTANTE: distribución tomada de ARQ-03; verificarla con el reparto actual del equipo.</text></svg>