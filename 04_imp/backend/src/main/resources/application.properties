spring.application.name=cns_backend

# Conexion a PostgreSQL. Aqui solo van valores por defecto, SIN secretos.
# Tus datos reales van en application-local.properties (copia application-local.properties.example; esta en
# .gitignore y nunca se sube) o en las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cns_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}

# Migraciones (db/migration). Son idempotentes: en una base que ya tenia las tablas sin historial de Flyway,
# baseline-version=0 hace que se apliquen todas (V1, V2, ...) sin borrar nada.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hora del hospital (no la de la maquina): agenda, recetas y vencimiento de sesiones.
cns.zona-horaria=${CNS_ZONA_HORARIA:America/La_Paz}

# Sesiones (token en la BD) y limite de intentos de login y de registro.
cns.sesion.horas=${CNS_SESION_HORAS:8}
cns.intentos.maximo=5
cns.intentos.ventana-minutos=15
cns.intentos.bloqueo-minutos=15

# Administrador inicial: si no existe ningun ADMINISTRADOR activo y CNS_ADMIN_CLAVE tiene valor, se crea al arrancar.
cns.admin.usuario=${CNS_ADMIN_USUARIO:admin}
cns.admin.clave=${CNS_ADMIN_CLAVE:}
cns.admin.nombre=${CNS_ADMIN_NOMBRE:Administrador del sistema}

# Origen de la web Nuxt del medico (CORS). Varios origenes separados por coma.
cns.web.origen=${CNS_WEB_ORIGEN:http://localhost:3000}
