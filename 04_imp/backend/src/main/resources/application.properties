spring.application.name=cns_backend

# Conexion JDBC a PostgreSQL (valores por defecto, sin secretos).
# Tus datos reales van en application-local.properties (ignorado por Git) o en variables DB_URL, DB_USER, DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cns_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# T100-00: todavia no hay migraciones en db/migration y la BD local ya tiene tablas sin historial de Flyway.
# Activar (true) cuando existan los scripts V1__*.sql de las tarjetas de base de datos.
spring.flyway.enabled=false

# T100-18: origen de la web Nuxt del medico (CORS). Varios origenes separados por coma.
cns.web.origen=${CNS_WEB_ORIGEN:http://localhost:3000}
